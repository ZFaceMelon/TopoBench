# @package _global_
# One fixed TRAWL configuration for every MANTRA task (ORIENT, NAME, Betti).
# Only the dataset (and, for Betti, the loss/monitor shape in
# trawl/mantra_fixed_betti) changes between tasks; walks and architecture
# never do. Recipe = trawl/mantra_arch: readout dropout 0, early stopping
# patience 40, LR-plateau patience 10, class-balanced cross-entropy, model
# selection on validation.
#
# Walks: separate walks per relation over the vertex-edge and edge-triangle
# incidences plus triangle adjacency (down_adjacency-2), 12 walks per
# relation. Steps carry the revisit encoding (anonymous-walk id, revisit gap)
# and the local signed boundary / relative-orientation coefficient of the
# relation crossed. No running orientation: parity is learned by the GRU.
defaults:
  - override /model: combinatorial/trawl
  - override /optimizer: trawl
  - override /transforms: trawl_existing

transforms:
  trawl:
    neighborhoods: [up_incidence-0, up_incidence-1, down_adjacency-2]
    signs: true

dataset:
  split_params:
    # Five seeds of the HOPSE/TopoBench protocol: stratified 50/25/25.
    split_type: seeded_stratified
    data_seed: ${seed}
    train_prop: 0.5
  dataloader_params:
    batch_size: 128
    order_seed: ${seed}
    # Sparse incidences cannot be pinned.
    pin_memory: false
trainer:
  max_epochs: 100
  check_val_every_n_epoch: 1
  gradient_clip_val: 1.0
callbacks:
  early_stopping:
    patience: 40
optimizer:
  parameters:
    lr: 0.001
    weight_decay: 0.001
  scheduler:
    monitor: val/f1
    scheduler_params:
      patience: 10
model:
  backbone:
    architecture: gru
    walk_scope: separate
    num_neighborhoods: 3
    revisit_embedding: true
    orientation_embedding: true
    running_orientation: false
    walks:
      k: 12
    hidden_dim: 128
    dropout: 0.1
    eval_views: 3
    # 43k small complexes: cache every transition table.
    transition_cache_size: 400000
    layer_options:
      mamba:
        backend: mamba_ssm
  readout:
    dropout: 0.0
loss:
  dataset_loss:
    class_weights: balanced
evaluation:
  walk_views: 3
evaluator:
  validate_args: false
tags: [trawl, mantra, fixed]
