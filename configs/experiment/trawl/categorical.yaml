# @package _global_
# Reusable categorical/DeepSet profile. No historical ZINC score is claimed.
defaults:
  - override /model: general/trawl_categorical
  - override /transforms: trawl_historical
transforms:
  historical:
    # Split-local seeds give every graph its own RWSE and walk identity.
    split_seeds: true
    guidance:
      gamma: 0.0
    spectral:
      heat_times: []
      electrostatic_betas: []
      laplacian_dim: 0
pretraining:
  enabled: false
dataset:
  dataloader_params:
    pin_memory: true
evaluator:
  validate_args: false
