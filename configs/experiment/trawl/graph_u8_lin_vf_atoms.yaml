# @package _global_
# V2 = graph_u8_lin_vf + an atom-level walk family: nodes over bonds
# (up_adjacency-0), walked alongside the 2-cell family (walk_scope separate,
# mean fusion). The 2-cell family still falls back to edge walks
# (down_adjacency-1) in graphs without edge-adjacent 2-cells. Walk guidance is
# the model default (gamma 0.2, diffusion_t 0.1), the same as the old TRAWL
# graph recipes.
defaults:
  - /experiment/trawl/graph_u8_lin_vf@_here_

transforms:
  trawl:
    neighborhoods: [down_adjacency-2, down_adjacency-1, up_adjacency-0]
model:
  backbone:
    num_neighborhoods: 3
    fallback_family: 1
tags: [trawl, graph, u8_lin, vertex_features, atoms]
