# @package _global_
# Base TRAWL recipe for the MANTRA simplicial tasks (NAME, ORIENT, Betti).
# MANTRA complexes are native simplicial, so no lifting: TRAWL reads their
# incidences directly. The search varies encodings, backbone, neighborhoods
# and walks on top of this.
defaults:
  - override /model: combinatorial/trawl
  - override /optimizer: trawl
  - override /transforms: trawl_existing

dataset:
  split_params:
    # Five seeds of the HOPSE/TopoBench protocol: stratified 50/25/25.
    split_type: seeded_stratified
    data_seed: ${seed}
    train_prop: 0.5
  dataloader_params:
    batch_size: 128
    order_seed: ${seed}
    # Sparse incidences cannot be pinned.
    pin_memory: false
trainer:
  max_epochs: 100
  check_val_every_n_epoch: 1
  gradient_clip_val: 1.0
callbacks:
  early_stopping:
    patience: 20
optimizer:
  parameters:
    lr: 0.001
    weight_decay: 0.001
  scheduler:
    monitor: val/f1
model:
  backbone:
    hidden_dim: 128
    dropout: 0.1
    eval_views: 3
    # 43k small complexes: cache every transition table.
    transition_cache_size: 400000
    layer_options:
      mamba:
        backend: mamba_ssm
evaluation:
  walk_views: 3
evaluator:
  validate_args: false
tags: [trawl, mantra]
