# @package _global_
# Later rich hybrid gated variant, distinct from the headline champion.
# The historical launcher loaded the native continuous node attribute
# (TRAWL_USE_NODE_ATTR=1, TRAWL_NODE_ATTR_DIM=1) and used top-5 weight
# averaging, which this preset inherits from proteins_hybrid.
defaults:
  - /experiment/trawl/proteins_hybrid

dataset:
  loader:
    parameters:
      use_node_attr: true
  parameters:
    num_features: 4
transforms:
  historical:
    profile: extended
    lifting: gated
    rich_features: true
    attr_dim: 1
model:
  backbone:
    pe_dim: 78
    branch_gate:
      prior: 0.7
      hidden_dim: 64
