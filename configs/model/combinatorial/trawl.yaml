_target_: topobench.model.TBModel
model_name: trawl
model_domain: combinatorial
compile: false
compile_scope: layers
feature_encoder: null
backbone:
  _target_: topobench.nn.backbones.combinatorial.trawl.TRAWL
  _recursive_: false
  hidden_dim: 128
  max_rank: 2
  in_channels: null
  pe_dim: null
  architecture: hybrid
  depth: 5
  layers: null
  layer_options:
    mamba:
      d_state: 16
      d_conv: 4
      expand: 2
      backend: torch
      scan: parallel
    sisa:
      n_heads: 8
      d_ssm: 16
      attention_dropout: 0.1
      dropout: 0.3
      expansion: 2
  walk_scope: union
  num_neighborhoods: 2
  encoder_sharing: shared
  fusion: mean
  pooling: mean_max
  rank_embedding: true
  num_colors: 0
  move_embedding: true
  dropout: 0.0
  seed: ${seed}
  eval_views: 1
  checkpoint_layers: false
  walk_refresh: train
  occurrence_pooling: mean
  graph_readout: walks
  transition_cache_size: 1024
  # Architecture-experiment flags (all off = baseline behaviour).
  revisit_embedding: false
  max_anonymous_ids: 32
  orientation_embedding: false # needs transforms.trawl.signs=true
  running_orientation: false # needs transforms.trawl.signs=true
  pe_skip: false
  pe_norm: false
  pivot_embedding: false # needs transforms.trawl.pivots=true
  cell_memory: false # needs transforms.trawl.pivots=true
  walk_attention: false
  vertex_ids: false # needs transforms.trawl.cell_vertices=true
  walks_per_family: null # separate scope: walks per family, overrides walks.k
  use_pe: true # false drops trawl_pe from the walk tokens (ablation)
  back_pointers: false # needs vertex_ids: per-walk links to earlier touches of the same vertices/cell
  straight_p: 0.0 # >0: straight (zig-zag) biased walks; needs cell_vertices + pivots
  walks:
    k: 32
    length: 32
    start_policy: coverage
    epsilon: 0.05
    reverse: false
    guidance:
      gamma: 0.2
      diffusion_t: 0.1
      dense_limit: 2048
readout:
  _target_: topobench.nn.backbones.combinatorial.trawl.TRAWLReadout
  hidden_dim: ${model.backbone.hidden_dim}
  graph_dim: ${trawl_output_dim:${model.backbone.hidden_dim},${model.backbone.pooling}}
  out_channels: ${dataset.parameters.num_classes}
  task_level: ${dataset.parameters.task_level}
  head_hidden: ${model.backbone.hidden_dim}
  dropout: 0.5
  aggregation: embedding
  walk_reduce: mean
